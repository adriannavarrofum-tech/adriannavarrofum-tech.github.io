<!-- SDKs clásicos de Firebase (Compat) que SÍ funcionan en cualquier teléfono sin bloqueos -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // Configuración de tu proyecto
    const firebaseConfig = {
      apiKey: "AIzaSyBXBiHp5C5f0-mkbwiTroq2ij3ui-ImbNg",
      authDomain: "gol--estilo-sport-903f2.firebaseapp.com",
      projectId: "gol--estilo-sport-903f2",
      storageBucket: "gol--estilo-sport-903f2.firebasestorage.app",
      messagingSenderId: "62035978995",
      appId: "1:62035978995:web:eb6b982106876b40cfa586",
      measurementId: "G-R3KSWY1VDJ"
    };

    // Inicializar Firebase Compat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PASSWORD_ADMIN = "12345"; 
    let productos = [];
    let categoriaSeleccionada = 'TODOS';

    let currentSlide = 0;
    setInterval(() => {
        const slides = document.querySelectorAll('.announcement-slide');
        if(slides.length > 0) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
    }, 3500);

    window.onload = function() {
        cargarProductosDesdeFirestore();
    };

    async function cargarProductosDesdeFirestore() {
        try {
            const querySnapshot = await db.collection("productos").get();
            productos = [];
            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                productos.push({
                    id: docSnap.id,
                    ...data,
                    imagenes: data.imagenes && data.imagenes.length > 0 ? data.imagenes : (data.img ? [data.img] : [])
                });
            });
            renderCatalogo();
            chequearModoAdminGuardado();
        } catch (error) {
            console.error("Error al cargar productos: ", error);
            document.getElementById('catalogo-container').innerHTML = `<div class="empty-msg">Error al conectar con la base de datos de Firebase.</div>`;
        }
    }

    window.renderCatalogo = function() {
        const container = document.getElementById('catalogo-container');
        const searchText = document.getElementById('search-input').value.toLowerCase().trim();
        container.innerHTML = '';

        if (productos.length === 0) {
            container.innerHTML = `<div class="empty-msg">El catálogo está vacío. Toca la tuerca (⚙️) abajo a la derecha, ingresa la contraseña <b>12345</b> y agrega tu primera prenda.</div>`;
            actualizarFiltros([]);
            return;
        }

        let prodsFiltrados = productos.filter(p => {
            const coincideTexto = p.titulo.toLowerCase().includes(searchText) || p.categoria.toLowerCase().includes(searchText) || (p.detalles && p.detalles.toLowerCase().includes(searchText));
            const coincideCat = (categoriaSeleccionada === 'TODOS' || p.categoria === categoriaSeleccionada);
            return coincideTexto && coincideCat;
        });

        actualizarFiltros([...new Set(productos.map(p => p.categoria))]);

        if (prodsFiltrados.length === 0) {
            container.innerHTML = `<div class="empty-msg">No se encontraron camisetas con esa búsqueda.</div>`;
            return;
        }

        const categoriasUnicas = [...new Set(prodsFiltrados.map(p => p.categoria))];

        categoriasUnicas.forEach(cat => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section-header';
            sectionDiv.innerText = cat;
            container.appendChild(sectionDiv);

            const prodsCat = prodsFiltrados.filter(p => p.categoria === cat);

            prodsCat.forEach(p => {
                const card = document.createElement('div');
                card.className = `card ${p.agotado ? 'agotado' : ''}`;

                let detallesHtml = p.detalles ? `<div class="card-details">📌 ${p.detalles}</div>` : '';
                let imgs = p.imagenes && p.imagenes.length > 0 ? p.imagenes : [p.img || 'https://via.placeholder.com/300'];

                let imgsHtml = '';
                let dotsHtml = '';
                imgs.forEach((imgUrl, index) => {
                    imgsHtml += `<img src="${imgUrl.trim()}" class="card-img ${index === 0 ? 'active' : ''}" data-index="${index}" alt="${p.titulo}">`;
                    dotsHtml += `<span class="dot ${index === 0 ? 'active' : ''}" onclick="window.cambiarImagenCard('${p.id}', ${index})"></span>`;
                });

                let controlesCarrusel = imgs.length > 1 ? `
                    <button class="carousel-btn prev" onclick="window.moverCarrusel('${p.id}', -1)">&#10094;</button>
                    <button class="carousel-btn next" onclick="window.moverCarrusel('${p.id}', 1)">&#10095;</button>
                    <div class="carousel-dots" id="dots-${p.id}">${dotsHtml}</div>
                ` : '';

                card.innerHTML = `
                    <div class="badge-agotado">AGOTADO</div>
                    <div class="card-img-container" id="carousel-${p.id}">
                        ${imgsHtml}
                        ${controlesCarrusel}
                    </div>
                    <div class="card-body">
                        <div>
                            <h2 class="card-title">${p.titulo}</h2>
                            ${detallesHtml}
                            <div class="price">${p.precio}</div>
                            <div class="size-selector">
                                <label>Selecciona tu Talla:</label>
                                <div class="sizes-flex" id="sizes-${p.id}">
                                    <button class="size-btn selected" onclick="window.seleccionarTalla(this, '${p.id}', 'S')">S</button>
                                    <button class="size-btn" onclick="window.seleccionarTalla(this, '${p.id}', 'M')">M</button>
                                    <button class="size-btn" onclick="window.seleccionarTalla(this, '${p.id}', 'L')">L</button>
                                    <button class="size-btn" onclick="window.seleccionarTalla(this, '${p.id}', 'XL')">XL</button>
                                    <button class="size-btn" onclick="window.seleccionarTalla(this, '${p.id}', 'XXL')">XXL</button>
                                </div>
                            </div>
                        </div>
                        <a href="#" onclick="window.enviarWhatsApp(event, '${p.titulo}', '${p.id}')" class="btn-ws">Pedir por WhatsApp</a>
                        <div class="admin-controls">
                            <div class="admin-row">
                                <button class="btn-admin btn-toggle" onclick="window.toggleAgotado('${p.id}', ${Boolean(p.agotado)})">${p.agotado ? 'Disponible' : 'Agotar'}</button>
                                <button class="btn-admin btn-edit" onclick="window.abrirEditarProducto('${p.id}')">Editar</button>
                            </div>
                            <div class="admin-row">
                                <button class="btn-admin btn-delete" onclick="window.eliminarProducto('${p.id}')">Eliminar Prenda</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    window.moverCarrusel = function(prodId, direccion) {
        const container = document.getElementById(`carousel-${prodId}`);
        if (!container) return;
        const imgs = container.querySelectorAll('.card-img');
        const dots = document.querySelectorAll(`#dots-${prodId} .dot`);
        let currentIndex = Array.from(imgs).findIndex(img => img.classList.contains('active'));
        
        if (currentIndex === -1) currentIndex = 0;
        imgs[currentIndex].classList.remove('active');
        if(dots.length > 0 && dots[currentIndex]) dots[currentIndex].classList.remove('active');

        let nuevoIndex = currentIndex + direccion;
        if (nuevoIndex >= imgs.length) nuevoIndex = 0;
        if (nuevoIndex < 0) nuevoIndex = imgs.length - 1;

        imgs[nuevoIndex].classList.add('active');
        if(dots.length > 0 && dots[nuevoIndex]) dots[nuevoIndex].classList.add('active');
    }

    window.cambiarImagenCard = function(prodId, index) {
        const container = document.getElementById(`carousel-${prodId}`);
        if (!container) return;
        const imgs = container.querySelectorAll('.card-img');
        const dots = document.querySelectorAll(`#dots-${prodId} .dot`);

        imgs.forEach(img => img.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));

        if (imgs[index]) imgs[index].classList.add('active');
        if (dots[index]) dots[index].classList.add('active');
    }

    window.seleccionarTalla = function(btn, prodId, talla) {
        const contenedor = document.getElementById(`sizes-${prodId}`);
        contenedor.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    window.enviarWhatsApp = function(e, titulo, prodId) {
        e.preventDefault();
        const contenedor = document.getElementById(`sizes-${prodId}`);
        const tallaBtn = contenedor.querySelector('.size-btn.selected');
        const tallaSeleccionada = tallaBtn ? tallaBtn.innerText : 'Única';
        const mensajeWsp = encodeURIComponent(`Hola, me interesa la camisa ${titulo} en talla ${tallaSeleccionada}.`);
        window.open(`https://wa.me/584128539283?text=${mensajeWsp}`, '_blank');
    }

    function actualizarFiltros(categorias) {
        const container = document.getElementById('filters-container');
        let html = `<button class="filter-chip ${categoriaSeleccionada === 'TODOS' ? 'active' : ''}" onclick="window.filtrarPorCategoria('TODOS', this)">Todos</button>`;
        
        categorias.forEach(cat => {
            html += `<button class="filter-chip ${categoriaSeleccionada === cat ? 'active' : ''}" onclick="window.filtrarPorCategoria('${cat}', this)">${cat}</button>`;
        });
        container.innerHTML = html;
    }

    window.filtrarPorCategoria = function(cat, elemento) {
        categoriaSeleccionada = cat;
        document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        renderCatalogo();
    }

    window.filtrarCatalogo = function() {
        renderCatalogo();
    }

    function chequearModoAdminGuardado() {
        let esAdmin = sessionStorage.getItem('gol_admin_activo') === 'true';
        if (esAdmin) {
            document.body.classList.add('admin-mode');
            document.getElementById('fab-admin').innerText = "➕";
            document.getElementById('fab-admin').title = "Agregar Nueva Prenda";
        }
    }

    window.accionBotonAdmin = function() {
        let esAdmin = sessionStorage.getItem('gol_admin_activo') === 'true';
        if (!esAdmin) {
            let pass = prompt("Ingrese la contraseña de Administrador:");
            if (pass === PASSWORD_ADMIN) {
                sessionStorage.setItem('gol_admin_activo', 'true');
                document.body.classList.add('admin-mode');
                document.getElementById('fab-admin').innerText = "➕";
                document.getElementById('fab-admin').title = "Agregar Nueva Prenda";
                abrirModalNuevo();
            } else if (pass !== null) {
                alert("Contraseña incorrecta");
            }
        } else {
            abrirModalNuevo();
        }
    }

    function abrirModalNuevo() {
        document.getElementById('modal-title').innerText = "Panel de Control - Agregar Prenda";
        document.getElementById('btn-submit-text').innerText = "Guardar en Firestore";
        document.getElementById('product-form').reset();
        document.getElementById('edit-id').value = "";
        document.getElementById('admin-modal').style.display = 'flex';
    }

    window.abrirEditarProducto = function(id) {
        const p = productos.find(item => String(item.id) === String(id));
        if (!p) return;

        document.getElementById('modal-title').innerText = "Editar Prenda";
        document.getElementById('btn-submit-text').innerText = "Actualizar en Firestore";
        document.getElementById('edit-id').value = p.id;
        document.getElementById('cat-input').value = p.categoria;
        document.getElementById('title-input').value = p.titulo;
        document.getElementById('details-input').value = p.detalles || "";
        document.getElementById('price-input').value = p.precio;
        
        let imgsStr = p.imagenes ? p.imagenes.join(', ') : (p.img || "");
        document.getElementById('img-url-input').value = imgsStr;
        
        document.getElementById('admin-modal').style.display = 'flex';
    }

    window.cerrarModal = function() {
        document.getElementById('admin-modal').style.display = 'none';
    }

    window.guardarProducto = function(e) {
        e.preventDefault();
        const editId = document.getElementById('edit-id').value;
        const categoria = document.getElementById('cat-input').value;
        const titulo = document.getElementById('title-input').value;
        const detalles = document.getElementById('details-input').value;
        const precio = document.getElementById('price-input').value;
        const imgTexto = document.getElementById('img-url-input').value;

        const imagenes = imgTexto.split(',').map(url => url.trim()).filter(url => url.length > 0);

        if (imagenes.length === 0) {
            alert("Por favor ingresa al menos un enlace de imagen.");
            return;
        }

        ejecutarGuardadoFirestore(editId, categoria, titulo, detalles, precio, imagenes);
    }

    async function ejecutarGuardadoFirestore(editId, categoria, titulo, detalles, precio, imagenes) {
        try {
            if (editId) {
                await db.collection("productos").doc(editId).update({
                    categoria,
                    titulo,
                    detalles,
                    precio,
                    imagenes: imagenes,
                    img: imagenes[0] || ""
                });
                alert("✅ ¡Prenda actualizada en Firestore con éxito!");
            } else {
                await db.collection("productos").add({
                    categoria,
                    titulo,
                    detalles,
                    precio,
                    imagenes: imagenes,
                    img: imagenes[0] || "",
                    agotado: false
                });
                alert("✅ ¡Prenda guardada en Firestore con éxito!");
            }
            cerrarModal();
            cargarProductosDesdeFirestore();
        } catch (error) {
            console.error("Error al guardar en Firestore: ", error);
            alert("Hubo un error al guardar en la base de datos.");
        }
    }

    window.toggleAgotado = async function(id, estadoActual) {
        try {
            await db.collection("productos").doc(id).update({
                agotado: !estadoActual
            });
            cargarProductosDesdeFirestore();
        } catch (error) {
            console.error("Error al cambiar estado: ", error);
        }
    }

    window.eliminarProducto = async function(id) {
        if(confirm("¿Seguro que deseas eliminar esta prenda de Firestore?")) {
            try {
                await db.collection("productos").doc(id).delete();
                alert("🗑️ Prenda eliminada.");
                cargarProductosDesdeFirestore();
            } catch (error) {
                console.error("Error al eliminar: ", error);
                alert("Hubo un error al eliminar la prenda.");
            }
        }
    }
</script>
